name = "leandag"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDag", "LeanDagTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's header linter wants a mathlib-style copyright block at the top of
# every file; the project is MIT-licensed (see LICENSE) but does not carry
# per-file headers. The rest of the standard set is kept.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanDag"

# Concrete models used to confirm the definitions are satisfiable rather than
# vacuously true. Built by default so a definition change that empties the
# structures fails the build instead of silently trivialising every theorem.
[[lean_lib]]
name = "LeanDagTest"

# The node's simulator and executables (`docs/validator.md` §6): run with
# `lake exe sim` and `lake exe node`.
[[lean_lib]]
name = "LeanDagSim"

[[lean_exe]]
name = "sim"
root = "LeanDagSim.SimMain"

[[lean_exe]]
name = "node"
root = "LeanDagSim.NodeMain"
